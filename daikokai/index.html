<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大航海の因果マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Yomogi&display=swap">
<style>
/* ref: たんご 脱AI Zine（public/assets/zine.css）＋ 星図の紙（星座早見）＋ 航海日誌の半券
   VOICE: 夜の自習室。先輩風はごく薄く、です・ます。仕組みの言葉を出さない
   IDEA: 因果の矢印を「星座」として夜空に刷った星図。1語＝1つの星、覚えるほど明るく灯る
   PICTURE: 上半分を占める因果の星座図（出来事=星・矢印=星座線）。押すと原因と結果の線だけが光る
   COLOUR and TYPE: 黒＋紫のダークリソ（HSLのみ・紫→青グラデ無し）・差し色 teal／Noto Sans JP 900・数字は Anton・手書き Yomogi
   LAYOUT: 題→今日の問題（主役ボタン1つ）→星座図→練習の棚→その他（畳む）。出題中は世界観を沈め、結果で開放する */
:root{
  color-scheme:dark;
  --paper:hsl(276,15%,8%); --paper-2:hsl(276,13%,12%); --paper-edge:hsl(276,11%,23%); --paper-deep:hsl(276,17%,6%);
  --ink:hsl(280,18%,93%); --ink-soft:hsl(280,10%,74%); --pencil:hsl(280,8%,66%);
  --pink:hsl(281,62%,66%); --pink-wash:hsla(281,62%,66%,.16);
  --teal:hsl(168,42%,52%); --teal-wash:hsla(168,42%,52%,.14);
  --good:hsl(150,50%,58%); --bad:hsl(2,78%,66%); --warn:hsl(42,78%,62%);
  --good-wash:hsla(150,50%,58%,.14); --bad-wash:hsla(2,78%,64%,.10);
  --card:hsl(276,14%,11%); --line:hsl(276,11%,23%); --edge-ui:hsl(276,10%,48%); --edge-soft:hsl(276,11%,38%);
  --stripe-a:hsl(276,17%,5%); --stripe-b:hsl(281,58%,45%);
  --stripes:repeating-linear-gradient(135deg,var(--stripe-a) 0 8px,var(--stripe-b) 8px 16px);
  --shadow-hand:2px 3px 0 hsl(281,45%,26%),5px 9px 20px hsla(0,0%,0%,.55);
  --shadow-btn:0 1px 2px hsla(276,30%,2%,.5),0 6px 16px hsla(276,30%,2%,.35);
  --r-card:14px 7px 13px 8px; --r-big:16px 8px 16px 8px; --r-btn:9px 6px 9px 6px; --r-choice:10px 6px 10px 6px; --r-chip:8px 4px 8px 4px;
  --tilt-a:-1.1deg; --tilt-b:.7deg; --tilt-c:-.4deg;
  --f1:5px; --f2:8px; --f3:13px; --f4:21px; --f5:34px; --f6:55px; --s2:11px; --s3:18px; --s4:29px;
  --dur-1:100ms; --dur-2:200ms; --dur-3:300ms;
  --ease-enter:cubic-bezier(.22,1,.36,1); --ease-std:cubic-bezier(.4,0,.2,1); --ease-exit:cubic-bezier(.4,0,1,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --f-disp:'Anton','Noto Sans JP',sans-serif; --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace; --f-hand:'Yomogi','Noto Sans JP',cursive;
  --t-min:.875rem; --h-main:44px; --h-btn:40px; --h-sm:36px;
  --sky:hsl(276,17%,6%); --star-off:hsl(280,8%,52%); --star-mid:hsl(45,80%,66%); --star-on:hsl(281,62%,72%);
  --e-cause:hsl(280,14%,78%); --e-part:hsl(168,42%,56%); --e-cond:hsl(280,8%,60%); --e-adjust:hsl(42,78%,62%);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
}
/* 明るい画面＝白い紙にエメラルド1色で刷った星図（たんご docs/DESIGN-LIGHT.md と同じ反転） */
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  color-scheme:light;
  --paper:hsl(150,20%,97%); --paper-2:hsl(150,16%,93%); --paper-edge:hsl(152,12%,82%); --paper-deep:hsl(150,22%,95%);
  --ink:hsl(160,30%,11%); --ink-soft:hsl(160,12%,28%); --pencil:hsl(160,8%,36%);
  --pink:hsl(158,72%,26%); --pink-wash:hsla(158,72%,30%,.11); --teal:hsl(270,42%,46%); --teal-wash:hsla(270,42%,46%,.10);
  --good:hsl(138,58%,26%); --bad:hsl(2,70%,44%); --warn:hsl(34,85%,32%); --good-wash:hsla(138,58%,32%,.12); --bad-wash:hsla(2,70%,50%,.08);
  --card:hsl(150,25%,99%); --line:hsl(152,12%,82%); --edge-ui:hsl(156,10%,46%); --edge-soft:hsl(156,10%,56%);
  --stripe-a:hsl(150,25%,99%); --stripe-b:hsl(158,62%,32%);
  --shadow-hand:2px 3px 0 hsl(156,30%,80%),5px 9px 20px hsla(160,30%,15%,.10);
  --shadow-btn:0 1px 2px hsla(160,30%,15%,.18),0 6px 16px hsla(160,30%,15%,.12);
  --sky:hsl(150,22%,95%); --star-off:hsl(160,6%,62%); --star-mid:hsl(40,80%,40%); --star-on:hsl(158,72%,28%);
  --e-cause:hsl(160,20%,30%); --e-part:hsl(270,42%,46%); --e-cond:hsl(160,8%,50%); --e-adjust:hsl(34,85%,36%);
}}
:root[data-theme=light]{
  color-scheme:light;
  --paper:hsl(150,20%,97%); --paper-2:hsl(150,16%,93%); --paper-edge:hsl(152,12%,82%); --paper-deep:hsl(150,22%,95%);
  --ink:hsl(160,30%,11%); --ink-soft:hsl(160,12%,28%); --pencil:hsl(160,8%,36%);
  --pink:hsl(158,72%,26%); --pink-wash:hsla(158,72%,30%,.11); --teal:hsl(270,42%,46%); --teal-wash:hsla(270,42%,46%,.10);
  --good:hsl(138,58%,26%); --bad:hsl(2,70%,44%); --warn:hsl(34,85%,32%); --good-wash:hsla(138,58%,32%,.12); --bad-wash:hsla(2,70%,50%,.08);
  --card:hsl(150,25%,99%); --line:hsl(152,12%,82%); --edge-ui:hsl(156,10%,46%); --edge-soft:hsl(156,10%,56%);
  --stripe-a:hsl(150,25%,99%); --stripe-b:hsl(158,62%,32%);
  --shadow-hand:2px 3px 0 hsl(156,30%,80%),5px 9px 20px hsla(160,30%,15%,.10);
  --shadow-btn:0 1px 2px hsla(160,30%,15%,.18),0 6px 16px hsla(160,30%,15%,.12);
  --sky:hsl(150,22%,95%); --star-off:hsl(160,6%,62%); --star-mid:hsl(40,80%,40%); --star-on:hsl(158,72%,28%);
  --e-cause:hsl(160,20%,30%); --e-part:hsl(270,42%,46%); --e-cond:hsl(160,8%,50%); --e-adjust:hsl(34,85%,36%);
}

/* ── 基盤 ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-padding-bottom:180px}
body{min-height:100vh;background:var(--paper);background-image:var(--grain);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.75;overflow-x:clip;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,4vw)}
.num{font-family:var(--f-disp);font-weight:400;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft)}
.hand{font-family:var(--f-hand)}

/* ── ボタンの3段（zine.css と同じ）主役 .btn.main は1画面1つ ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--h-btn);padding:0 16px;font:700 var(--t-min)/1.2 var(--f-body);
  border:1.5px solid var(--ink);border-radius:var(--r-btn);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background-color var(--dur-1) var(--ease-std),border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),transform var(--dur-2) var(--ease-spring)}
.btn.main{min-height:52px;padding:0 24px;font-size:1.0625rem;font-weight:900;background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:var(--shadow-btn)}
.btn.main svg{width:18px;height:18px}
.btn.sm{min-height:var(--h-sm);padding:0 12px;border-color:var(--edge-soft);color:var(--ink-soft)}
.btn.text{border-color:transparent;background:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:0 8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (hover:hover){.btn:hover{background:var(--pink-wash)}.btn.main:hover{background:var(--pink);border-color:var(--pink)}.btn.text:hover{background:none;color:var(--ink)}}
/* [motion:press] trigger:押した瞬間 / total:100ms沈む＋200ms戻る / peak:100ms / easing:--ease-std→--ease-spring / cleanup:離すと transform が戻るだけ */
.btn:active,.choice:not([aria-disabled=true]):active,.star-btn:active,.shelf-item:active{transform:scale(.97);transition-duration:var(--dur-1);transition-timing-function:var(--ease-std)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:var(--f2) var(--s2);align-items:center}

/* ── 手の痕跡：トンボ ── */
.crop{position:absolute;width:16px;height:16px;opacity:.5;pointer-events:none}
.crop path{stroke:var(--ink);stroke-width:1.2;fill:none}
.crop.tl{top:9px;left:9px}.crop.tr{top:9px;right:9px;transform:scaleX(-1)}.crop.bl{bottom:9px;left:9px;transform:scaleY(-1)}.crop.br{bottom:9px;right:9px;transform:scale(-1)}

/* ── 画面の入れ替え（0.4秒以下） ──
   [motion:view-in] trigger:画面が変わる / total:220ms / peak:220ms / easing:--ease-enter / cleanup:animationend で何も残らない（fill:both の終端＝素の状態） */
.view{animation:view-in 220ms var(--ease-enter) both}
@keyframes view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ══ 入口 ══ */
.top{position:relative;padding:var(--s4) 0 var(--f4)}
.top .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--f4) var(--f5);align-items:end}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:400 1rem/1 var(--f-hand);color:var(--teal);transform:rotate(var(--tilt-a));transform-origin:left}
.eyebrow svg{width:18px;height:18px}
h1{font-weight:900;font-size:clamp(2rem,5.2vw,3.25rem);line-height:1.08;letter-spacing:.01em;text-wrap:balance;margin:var(--f2) 0 var(--f3)}
h1 .ln{display:inline-block}
.lead{color:var(--ink-soft);max-width:34em;text-wrap:pretty}
.today{position:relative;background:var(--card);border:1.5px solid var(--edge-soft);border-radius:var(--r-big);padding:var(--f4) var(--f4) var(--f4) calc(var(--f4) + 12px);box-shadow:var(--shadow-hand);transform:rotate(var(--tilt-b));overflow:hidden}
.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background-image:var(--stripes);opacity:.9}
.today h2{font-size:1.25rem;font-weight:900;line-height:1.35}
.today .sub{color:var(--ink-soft);font-size:var(--t-min);margin:4px 0 var(--f3)}
.today .btn.main{width:100%}
.meter{display:flex;align-items:baseline;gap:10px;margin-bottom:var(--f3)}
.meter .num{font-size:2.6rem;line-height:1}
.meter .of{color:var(--ink-soft);font-size:var(--t-min)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:var(--f3)}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--star-off)}
.dots i.mid{border-color:var(--star-mid);background:radial-gradient(circle,var(--star-mid) 0 35%,transparent 40%)}
.dots i.done{border-color:var(--star-on);background:var(--star-on);box-shadow:0 0 6px var(--star-on)}

/* ── 星座図（因果マップ） ── */
.chart{padding:var(--f3) 0 var(--f4)}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:var(--f2) var(--f4);margin-bottom:var(--f3)}
.chart-head h2{font-size:1.5rem;font-weight:900;line-height:1.3}
.chart-head p{color:var(--ink-soft);font-size:var(--t-min)}
.sky-scroll{position:relative;overflow-x:auto;overscroll-behavior-x:contain;border:1.5px solid var(--line);border-radius:var(--r-card);background:var(--sky);scrollbar-width:thin;scrollbar-color:var(--edge-soft) transparent}
.sky{position:relative;width:1192px;height:688px;margin:0 auto}
.sky>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.col-lb{position:absolute;top:14px;font:400 var(--t-min)/1 var(--f-hand);color:var(--pencil);white-space:nowrap}
.bgstar{fill:var(--ink);opacity:.22}
/* [motion:twinkle] AMBIENT trigger:常時 / total:5〜8s 周期 / peak:中間 / easing:ease-in-out相当 --ease-std / cleanup:reduced-motion で止まる。光は1秒に3回未満 */
.bgstar.tw{animation:twinkle 6.2s cubic-bezier(.4,0,.2,1) infinite alternate}
@keyframes twinkle{from{opacity:.08}to{opacity:.45}}
.edge{fill:none;stroke-width:1.6;stroke-linecap:round;transition:opacity var(--dur-2) var(--ease-std),stroke-width var(--dur-2) var(--ease-std)}
.edge.cause,.edge.pre,.edge.result{stroke:var(--e-cause)}
.edge.part{stroke:var(--e-part);stroke-dasharray:2 5;stroke-width:2.2}
.edge.cond{stroke:var(--e-cond);stroke-dasharray:8 6}
.edge.adjust{stroke:var(--e-adjust);stroke-dasharray:12 4 2 4}
.sky.has-sel .edge{opacity:.14}
.sky.has-sel .edge.hi{opacity:1;stroke-width:3}
/* [motion:flow] AMBIENT trigger:星をえらぶ / total:1.6s 周期 / peak:— / easing:linear（流れ） / cleanup:えらび直すと class が外れる */
.sky.has-sel .edge.hi.cause,.sky.has-sel .edge.hi.pre,.sky.has-sel .edge.hi.result{stroke-dasharray:10 6;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.star-btn{position:absolute;width:172px;height:62px;display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;align-content:center;
  padding:4px 4px 4px 4px;border:1.5px solid transparent;border-radius:var(--r-chip);background:transparent;cursor:pointer;text-align:left;color:var(--ink);
  transition:border-color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std),transform var(--dur-2) var(--ease-spring)}
.star-btn .st{grid-row:1/3;width:22px;height:22px;align-self:center}
.legend .st{width:20px;height:20px;display:block}
.star-btn .st circle{transition:fill var(--dur-3) var(--ease-std),stroke var(--dur-3) var(--ease-std)}
.star-btn .l1,.star-btn .l2{font-size:.9375rem;line-height:1.35;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star-btn .l1{font-weight:700}
.star-btn .l2{color:var(--ink-soft)}
.star-btn .tn{position:absolute;right:6px;top:-11px;font:700 .8125rem/1 var(--f-body);color:var(--teal);background:var(--sky);padding:1px 4px;border-radius:4px;letter-spacing:.04em}
@media (hover:hover){.star-btn:hover{border-color:var(--edge-ui);background:var(--pink-wash)}}
.star-btn[aria-pressed=true]{border-color:var(--pink);background:var(--pink-wash)}
.star-btn[data-m=none] .st .core{fill:none;stroke:var(--star-off)}
.star-btn[data-m=mid] .st .core{fill:var(--star-mid);stroke:var(--star-mid)}
.star-btn[data-m=done] .st .core{fill:var(--star-on);stroke:var(--star-on)}
.star-btn .st .halo{fill:none;stroke:none}
.star-btn[data-m=done] .st .halo{stroke:var(--star-on);opacity:.5}
.star-btn[data-m=done] .st .ray{stroke:var(--star-on)}
.star-btn .st .ray{stroke:none;stroke-width:1.4;stroke-linecap:round}
.legend{display:flex;flex-wrap:wrap;gap:6px var(--f4);margin-top:var(--f3);font-size:var(--t-min);color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{flex:none}
.pan-hint{display:none;font-size:var(--t-min);color:var(--ink-soft);margin-top:6px}
@media (max-width:1240px){.pan-hint{display:block}}

/* 星をえらんだ時の札 */
.detail{position:relative;margin-top:var(--f4);background:var(--card);border:1.5px solid var(--edge-soft);border-radius:var(--r-card);box-shadow:var(--shadow-hand);padding:var(--f4);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--f3) var(--f5);
  animation:view-in 220ms var(--ease-enter) both}
.detail h3{font-size:1.25rem;font-weight:900;line-height:1.35;outline:none}
.detail .desc{margin:6px 0 var(--f3);text-wrap:pretty}
.terms-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 10px;border:1.5px solid var(--edge-soft);border-radius:var(--r-chip);font-size:var(--t-min);font-weight:700;white-space:nowrap}
.chip .m{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--star-off)}
.chip .m.mid{background:var(--star-mid);border-color:var(--star-mid)}
.chip .m.done{background:var(--star-on);border-color:var(--star-on)}
.links h4{font-size:var(--t-min);color:var(--ink-soft);font-weight:700;margin-bottom:4px}
.links ul{list-style:none;display:grid;gap:6px;margin-bottom:var(--f3)}
.links li{font-size:var(--t-min);line-height:1.6;padding-left:12px;border-left:3px solid var(--edge-soft)}
.links li b{font-weight:700}
.links li .ty{color:var(--teal);font-weight:700;margin-right:6px}
.links li.part{border-left-color:var(--e-part)}.links li.cond{border-left-color:var(--e-cond)}.links li.adjust{border-left-color:var(--e-adjust)}
.detail .x{position:absolute;right:8px;top:8px;min-width:44px}

/* 練習の棚 */
.shelf{padding:var(--f4) 0 var(--f5)}
.shelf h2{font-size:1.5rem;font-weight:900;line-height:1.3;margin-bottom:4px}
.shelf>.wrap>p{color:var(--ink-soft);font-size:var(--t-min);margin-bottom:var(--f3)}
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--f3)}
.shelf-item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--f3);align-items:center;min-height:88px;padding:var(--f3) var(--f3) var(--f3) var(--f4);text-align:left;
  background:var(--card);border:1.5px solid var(--edge-soft);border-radius:var(--r-card);cursor:pointer;
  transition:border-color var(--dur-1) var(--ease-std),transform var(--dur-2) var(--ease-spring),box-shadow var(--dur-2) var(--ease-std)}
.shelf-item:nth-child(3n+1){transform:rotate(-.5deg)}.shelf-item:nth-child(3n+2){transform:rotate(.4deg)}
@media (hover:hover){.shelf-item:hover{border-color:var(--pink);box-shadow:var(--shadow-hand)}}
.shelf-item .t{font-weight:900;font-size:1.0625rem;line-height:1.35}
.shelf-item .d{grid-column:1;color:var(--ink-soft);font-size:var(--t-min);line-height:1.5}
.shelf-item .p{grid-row:1/3;grid-column:2;text-align:right;font-size:var(--t-min);color:var(--ink-soft);line-height:1.2}
.shelf-item .p .num{display:block;font-size:1.7rem;color:var(--ink)}
.shelf-item .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.shelf-item .bar i{display:block;height:100%;background:var(--pink);border-radius:2px}
.shelf-item::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--teal);opacity:.7}

/* その他（まれな操作は畳む） */
.more{padding:0 0 var(--f6)}
.more details{border-top:1.5px dashed var(--edge-soft);padding-top:var(--f2)}
summary.disc{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;min-height:48px;font-weight:700}
summary.disc::-webkit-details-marker{display:none}
summary.disc::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 0 2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform var(--dur-2) var(--ease-std)}
details[open]>summary.disc::before{transform:rotate(45deg)}
.settings{display:grid;gap:var(--f2);padding:var(--f2) 0 var(--f4)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--f3);min-height:48px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch input{appearance:none;flex:none;width:48px;height:28px;border-radius:14px;border:1.5px solid var(--edge-ui);background:var(--paper-2);position:relative;cursor:pointer;transition:background-color var(--dur-2) var(--ease-std)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--ink-soft);transition:transform var(--dur-2) var(--ease-spring),background-color var(--dur-2) var(--ease-std)}
.switch input:checked{background:var(--pink);border-color:var(--pink)}
.switch input:checked::after{transform:translateX(20px);background:var(--paper)}
.switch .d{display:block;font-size:var(--t-min);color:var(--ink-soft)}
.tbl-wrap{overflow-x:auto;margin:var(--f2) 0 var(--f4)}
table{border-collapse:collapse;width:100%;font-size:var(--t-min)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink-soft);font-weight:700}
td .chip{min-height:26px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:var(--f3);border:1.5px dashed var(--bad);border-radius:var(--r-card);margin-top:var(--f2)}
.foot{color:var(--pencil);font-size:var(--t-min);padding:var(--f4) 0 var(--f5);border-top:1px solid var(--line)}

/* ══ 出題中（世界観を沈める） ══ */
.play{min-height:100vh;display:flex;flex-direction:column}
.pbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.pbar .wrap{display:flex;align-items:center;gap:var(--f3);min-height:60px;max-width:760px}
.pbar .x{min-width:44px;padding:0 10px}
.pbar .x svg{width:18px;height:18px}
.steps{flex:1;display:flex;gap:3px;align-items:center}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background-color var(--dur-3) var(--ease-std)}
.steps i.ok{background:var(--good)}.steps i.ng{background:var(--bad)}.steps i.cur{background:var(--ink-soft)}
.pbar .cnt{font-family:var(--f-mono);font-size:var(--t-min);color:var(--ink-soft);white-space:nowrap}
.stage{flex:1;padding:var(--f4) 0 220px}
.stage .wrap{max-width:760px}
.qcard{position:relative;background:var(--card);border:1.5px solid var(--edge-soft);border-radius:var(--r-big);padding:var(--f4) var(--f4) var(--f4) calc(var(--f4) + 10px);box-shadow:var(--shadow-hand);overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background-image:var(--stripes);opacity:.85}
/* [motion:card-in] REACTIVE trigger:次の問題 / total:240ms / peak:240ms / easing:--ease-enter / cleanup:fill both の終端＝素の状態 */
.qcard.in{animation:card-in 240ms var(--ease-enter) both}
@keyframes card-in{from{opacity:0;transform:translateX(26px) rotate(.6deg)}to{opacity:1;transform:none}}
.qkind{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:var(--f3);font-size:var(--t-min);color:var(--ink-soft)}
.qkind .k{font-weight:700;color:var(--teal);border:1.5px solid var(--teal);border-radius:var(--r-chip);padding:1px 8px}
.qkind .lv{font-family:var(--f-hand);color:var(--pencil)}
.prompt{font-size:1.25rem;font-weight:700;line-height:1.6;text-wrap:pretty;outline:none}
.prompt b{color:var(--pink)}
.clue{margin:var(--f3) 0 var(--f4);padding:var(--f3) var(--f3) var(--f3) var(--f4);background:var(--paper-2);border-radius:var(--r-chip);border-left:3px solid var(--pink);font-size:1.0625rem;line-height:1.75}
.clue .hint{display:block;margin-top:6px;font-size:var(--t-min);color:var(--ink-soft)}
.statement{margin:var(--f3) 0 var(--f4);padding:var(--f3) var(--f4);border:1.5px dashed var(--edge-ui);border-radius:var(--r-card);font-size:1.125rem;font-weight:700;line-height:1.7;transform:rotate(var(--tilt-c))}
.kbd-hint{margin-top:var(--f3);font-size:var(--t-min);color:var(--pencil)}
.kbd-hint kbd{font:700 .8125rem/1 var(--f-mono);border:1px solid var(--edge-soft);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--ink-soft)}
@media (pointer:coarse){.kbd-hint{display:none}}

/* 4択（たんご choice.js と同じ部品） */
.choices{display:flex;flex-direction:column;gap:var(--f2)}
.choice{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:56px;padding:var(--f2) var(--f3);text-align:left;font:400 1.0625rem/1.5 var(--f-body);color:var(--ink);
  background:var(--paper);border:1.5px solid var(--edge-ui);border-radius:var(--r-choice);cursor:pointer;
  transition:border-color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),transform var(--dur-2) var(--ease-spring)}
.choice-k{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--edge-soft);border-radius:50%;font:700 var(--t-min)/1 var(--f-mono);color:var(--ink-soft)}
.choice{flex-wrap:wrap}
.choice-t{flex:1 1 11em;min-width:0}
.choice-t small{display:block;font-size:var(--t-min);color:var(--ink-soft);line-height:1.5}
.choice-m{flex:none;width:24px;height:24px;display:grid;place-items:center}
.choice-m svg{width:100%;height:100%}
@media (hover:hover){.choice:not([aria-disabled=true]):hover{border-color:var(--ink)}}
.choice[aria-disabled=true]{cursor:default}
.choice.picked{border-color:var(--pink);background:var(--pink-wash)}
.choice.correct,.choice.reveal{border-color:var(--good);background:var(--good-wash)}
.choice.reveal{transition-delay:var(--dur-1)}
.choice.wrong{border-color:var(--bad);border-width:2px}
.choice.done{color:var(--ink-soft);border-color:var(--line)}
/* [motion:ok-mark] REACTIVE trigger:正解 / total:300ms / peak:180ms / easing:--ease-spring / cleanup:fill both */
.choice.correct .choice-m{color:var(--good);animation:pop 300ms var(--ease-spring) both}
.choice.wrong .choice-m{color:var(--bad);animation:fadein 200ms var(--ease-std) both}
.choice.wrong{animation:nudge 260ms var(--ease-std)}
.choice-note{flex:none;font:700 var(--t-min)/1 var(--f-body);color:var(--good);border:1.5px solid var(--good);border-radius:var(--r-chip);padding:5px 7px;animation:fadein 200ms var(--ease-enter) 100ms both}
.choice-trap{flex:none;font:700 var(--t-min)/1.2 var(--f-body);color:var(--bad);border:1.5px solid var(--bad);border-radius:var(--r-chip);padding:4px 7px;animation:fadein 200ms var(--ease-enter) 100ms both;white-space:nowrap}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* [motion:nudge] REACTIVE trigger:まちがい / total:260ms / peak:65ms / easing:--ease-std / cleanup:終われば素の位置。揺れは2往復だけ */
@keyframes nudge{25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.choices.judge .choice-t b{font-weight:900}

/* 書いて思い出す */
.recall{display:grid;gap:var(--f2)}
.recall label{font-weight:700;font-size:var(--t-min);color:var(--ink-soft)}
.recall .in-row{display:flex;gap:var(--f2)}
.recall input{flex:1;min-height:56px;padding:0 var(--f3);font-size:1.25rem;font-weight:700;background:var(--paper);border:1.5px solid var(--edge-ui);border-radius:8px;color:var(--ink)}
.recall input:focus{outline:none;border:2px solid var(--pink)}
.recall input.ok{border:2px solid var(--good);background:var(--good-wash)}
.recall input.ng{border:2px solid var(--bad)}
.recall .tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.recall .hint-out{font-size:var(--t-min);color:var(--teal);font-weight:700}

/* 地図 */
.map-scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r-card);margin:var(--f3) 0;scrollbar-width:thin;overscroll-behavior-x:contain}
.map{position:relative;width:100%;min-width:860px;aspect-ratio:1300/535;background:var(--paper-deep);overflow:hidden}
.map img{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(1) invert(.9) contrast(.85) brightness(.85);opacity:.9}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .map img{filter:grayscale(1) contrast(.9);opacity:.85}}
:root[data-theme=light] .map img{filter:grayscale(1) contrast(.9);opacity:.85}
.map::after{content:"";position:absolute;inset:0;background:var(--pink-wash);mix-blend-mode:color;pointer-events:none}
.map svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:2px solid var(--paper);background:var(--ink);color:var(--paper);
  font:700 .9375rem/1 var(--f-mono);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px hsla(0,0%,0%,.4);
  transition:transform var(--dur-2) var(--ease-spring),background-color var(--dur-1) var(--ease-std)}
.pin::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.pin[aria-pressed=true]{background:var(--pink);transform:translate(-50%,-50%) scale(1.18)}
.pin.is-correct{background:var(--good)}.pin.is-wrong{background:var(--bad)}
@media (pointer:coarse){.pin{width:44px;height:44px}.map{min-width:1040px}}
.pin-name{position:absolute;z-index:3;transform:translate(-50%,-170%);background:var(--paper);color:var(--ink);font-size:var(--t-min);font-weight:700;padding:1px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;border:1px solid var(--edge-ui)}
.route{fill:none;stroke:var(--warn);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
/* [motion:route] CELEBRATION trigger:地図の答え合わせ / total:1.4s / peak:終わり / easing:--ease-enter / cleanup:forwards で描き終わりのまま */
.route{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1400ms cubic-bezier(.22,1,.36,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.place-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--f2)}
.place-grid .choice{min-height:52px}
.check-row{margin-top:var(--f4);display:flex;justify-content:flex-end}

/* つなぐ（並べ替え） */
.chain{list-style:none;display:grid;gap:var(--f2);margin:var(--f3) 0}
.chain li{display:grid;grid-template-columns:44px 28px minmax(0,1fr) auto;gap:var(--f2);align-items:center;min-height:60px;padding:6px 6px 6px 0;background:var(--paper);
  border:1.5px solid var(--edge-ui);border-radius:var(--r-choice);transition:border-color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std),box-shadow var(--dur-2) var(--ease-std)}
.chain li .grip{display:grid;place-items:center;width:44px;height:48px;cursor:grab;touch-action:none;color:var(--ink-soft);border:0;background:none}
.chain li .grip svg{width:20px;height:20px}
.chain li .no{font:400 1.25rem/1 var(--f-disp);color:var(--pink);text-align:center}
.chain li .t{font-size:1rem;line-height:1.5}
.chain li .mv{display:flex;gap:4px}
.chain li .mv .btn{min-width:44px;min-height:44px;padding:0}
.chain li .mv .btn svg{width:18px;height:18px}
.chain li.drag{border-color:var(--pink);background:var(--card);box-shadow:var(--shadow-hand);z-index:5;position:relative;transition:none;cursor:grabbing}
.chain li.is-correct{border-color:var(--good);background:var(--good-wash)}
.chain li.is-wrong{border-color:var(--bad);border-width:2px}
.chain.locked li{grid-template-columns:28px minmax(0,1fr) auto;padding-left:10px}
.chain.locked .grip,.chain.locked .mv{display:none}
.linkq{margin-top:var(--f4);padding-top:var(--f3);border-top:1.5px dashed var(--edge-soft)}
.linkq .lk{font-weight:700;margin-bottom:var(--f2);line-height:1.6}
.linkq .lk .arr{color:var(--pink);margin:0 4px}


/* ── 連想の糸（拡大地図＋自問自答）──
   ref: 自分で問いを立てて答える「精緻化質問」＋ 場所の記憶（地図と言葉をセットに）
   [motion:thread] REACTIVE trigger:糸をたぐる / total:260ms / peak:260ms / easing:--ease-enter / cleanup:fill both */
.assoc{margin:var(--f3) 0 var(--f4);padding:var(--f3);border:1.5px dashed var(--edge-soft);border-radius:var(--r-card);background:var(--paper-2)}
.as-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:var(--f2)}
.as-t{font-size:1.0625rem;color:var(--teal)}
.as-chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{min-height:36px;padding:0 10px;border:1.5px solid var(--edge-soft);border-radius:var(--r-chip);background:transparent;color:var(--ink-soft);font:700 var(--t-min) var(--f-body);cursor:pointer}
.seg[aria-pressed=true]{background:var(--pink-wash);border-color:var(--pink);color:var(--ink)}
@media (pointer:coarse){.seg{min-height:44px}}
.amap-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;max-width:640px;border-radius:var(--r-chip)}
.amap{position:relative;width:100%;min-width:500px;overflow:hidden;border-radius:var(--r-chip);background:var(--paper-deep);border:1px solid var(--line)}
.amap img{position:absolute;max-width:none;height:auto;filter:grayscale(1) invert(.9) contrast(.85) brightness(.85);opacity:.9}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .amap img{filter:grayscale(1) contrast(.9);opacity:.85}}
:root[data-theme=light] .amap img{filter:grayscale(1) contrast(.9);opacity:.85}
.amap svg{position:absolute;inset:0;width:100%;height:100%}
.aarea{fill:var(--pink-wash);stroke:var(--pink);stroke-width:1.5;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.aline{fill:none;stroke:var(--warn);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.aline.route2{stroke-dasharray:6 4}
.aline.back{stroke-dasharray:2 5;opacity:.8}
.aline.river{stroke:var(--teal);stroke-width:3.5}
.aline.border{stroke:var(--bad);stroke-dasharray:10 5}
.aline.ship{stroke:var(--teal);stroke-dasharray:6 4}
.adot{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--ink);border:2px solid var(--paper)}
.alb{position:absolute;white-space:nowrap;font:700 var(--t-min)/1.25 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--edge-soft);border-radius:4px;padding:1px 6px;pointer-events:none}
.alb.p-r{transform:translate(9px,-50%)}.alb.p-l{transform:translate(calc(-100% - 9px),-50%)}.alb.p-t{transform:translate(-50%,calc(-100% - 8px))}.alb.p-b{transform:translate(-50%,8px)}
.alb.a{transform:translate(-50%,-50%);border-color:var(--pink)}
.alb.w{transform:translate(-50%,-50%);background:none;border:0;color:var(--ink-soft);font-family:var(--f-hand);font-weight:400}
.alb.ln{transform:translate(8px,-50%);}
.alb.ln.p-l{transform:translate(calc(-100% - 8px),-50%)}
.alb.ln{border-color:var(--teal);color:var(--ink)}
.alb.q{border:2px solid var(--warn);color:var(--warn);font-family:var(--f-disp);font-weight:400;padding:0 8px}
.as-steps{list-style:none;counter-reset:s;display:grid;gap:6px;margin:var(--f3) 0 0}
.as-steps:empty{display:none}
.as-steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:8px;font-size:.9375rem;line-height:1.65;outline:none}
.as-steps li::before{content:counter(s);grid-row:1/3;width:24px;height:24px;margin-top:2px;border-radius:50%;border:1.5px solid var(--teal);color:var(--teal);display:grid;place-items:center;font:700 .8125rem/1 var(--f-mono)}
.as-steps li b{font-weight:900}
.as-steps li.new{animation:view-in 260ms var(--ease-enter) both}
.as-steps li:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:4px}
.as-more{margin-top:var(--f2);border-color:var(--teal);color:var(--ink)}
.detail .assoc{margin-top:var(--f3)}
/* ── 答え合わせの帯（たんご 半券の帯 assets/feedback.js）──
   [motion:stub-in] REACTIVE trigger:答えた瞬間 / total:200ms / peak:200ms / easing:--ease-enter / cleanup:.on を外すと 160ms で下へ */
.tgfb{position:fixed;left:0;right:0;bottom:0;z-index:75;transform:translateY(105%);visibility:hidden;max-height:72vh;overflow-y:auto;
  background:var(--paper-2);border-top:2px dashed var(--edge-soft);box-shadow:0 -14px 30px -18px hsla(276,30%,2%,.8);
  padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));transition:transform 160ms var(--ease-exit),visibility 0s linear 160ms}
.tgfb.on{transform:none;visibility:visible;transition:transform var(--dur-2) var(--ease-enter),visibility 0s}
.tgfb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background-image:var(--stripes);opacity:.85}
.tgfb.ok{background:linear-gradient(var(--good-wash),var(--good-wash)),var(--paper-2);border-top-color:var(--good)}
.fb-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;align-items:center}
.fb-mk{grid-row:1/3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor}
.fb-mk svg{width:22px;height:22px}
.tgfb.ok .fb-mk{color:var(--good)}.tgfb.ng .fb-mk{color:var(--bad)}
.fb-h{font-weight:900;font-size:1.25rem;line-height:1.3;outline:none}
.tgfb.ok .fb-h{color:var(--good)}
.fb-a{font-size:1rem;line-height:1.55;overflow-wrap:anywhere}
.fb-a b{font-size:1.125rem}
.fb-x{grid-column:1/-1;font-size:var(--t-min);line-height:1.7;color:var(--ink);margin-top:6px}
.fb-x .trap{display:inline-block;font-weight:700;color:var(--bad);margin-right:6px}
.fb-flow{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px;font-size:var(--t-min)}
.fb-flow .n{border:1.5px solid var(--edge-soft);border-radius:var(--r-chip);padding:1px 8px;font-weight:700}
.fb-flow .a{color:var(--pink);font-weight:700}
.fb-go{grid-column:1/-1;display:flex;gap:var(--f2);margin-top:12px}
.fb-go .btn.main{flex:1}
.fb-t{position:absolute;left:10px;right:0;top:-2px;height:3px;background:var(--good);transform-origin:left;transform:scaleX(0)}
.tgfb.on.ok.auto .fb-t{animation:tgfb-t var(--fb-wait,1400ms) linear forwards}
.tgfb.paused .fb-t{animation-play-state:paused}
@keyframes tgfb-t{to{transform:scaleX(1)}}
/* [motion:spark] CELEBRATION(小) trigger:正解の帯が出る / total:600ms / peak:200ms / easing:--ease-enter / cleanup:forwards で消えたまま、次の帯で作り直す */
.spark{position:absolute;left:30px;top:30px;width:1px;height:1px;pointer-events:none}
.spark i{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--good);animation:spark 600ms cubic-bezier(.22,1,.36,1) forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* ══ 結果（世界観を開放する）══ */
.result{padding:var(--f5) 0 var(--f6)}
.result .wrap{max-width:900px}
.receipt{position:relative;background:var(--card);border:1.5px solid var(--edge-soft);border-radius:var(--r-big);box-shadow:var(--shadow-hand);padding:var(--f5) var(--f4) var(--f4);transform:rotate(var(--tilt-a));overflow:hidden}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:radial-gradient(circle at 6px 8px,var(--paper) 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.receipt h2{font-size:1rem;font-family:var(--f-hand);font-weight:400;color:var(--teal)}
.score{display:flex;align-items:baseline;gap:12px;margin:4px 0 2px}
.score .num{font-size:clamp(4rem,12vw,6.5rem);line-height:1}
.score .of{font-size:1.25rem;color:var(--ink-soft)}
.res-line{font-size:1.125rem;font-weight:700;text-wrap:balance}

.res-sky .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw2 600ms cubic-bezier(.22,1,.36,1) forwards}
@keyframes draw2{to{stroke-dashoffset:0}}

.res-sky .rs.ok circle{fill:var(--star-on)}.res-sky .rs.ng circle{fill:none;stroke:var(--bad);stroke-width:3}

const KEY = "daikokai-terms-v2";
const DAY = 864e5, WAIT = [0, 0, DAY, 3 * DAY, 7 * DAY]; // 箱1=すぐ・2=翌日・3=3日後・4=1週間後
let store = { r: {}, traps: {}, set: { auto: true, sound: false } };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); store = { r: s.r || {}, traps: s.traps || {}, set: Object.assign(store.set, s.set || {}) }; }
  else { // 前の版（因果マップ v1）の記録を引きつぐ
    const old = JSON.parse(localStorage.getItem("daikokai-causal-v1") || "null");
    if (old && old.q) for (const [id, r] of Object.entries(old.q)) if (qById[id]) { const box = Math.min(4, r.box || 1); store.r[id] = { box, seen: r.seen || 1, ok: r.ok || 0, last: r.last || Date.now(), due: (r.last || Date.now()) + WAIT[box] }; }
    if (old && old.traps) store.traps = old.traps;
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const rec = (id) => store.r[id] || null;
function record(id, ok, trap, soft) {
  const r = store.r[id] || { box: 1, seen: 0, ok: 0 };
  if (ok) { r.ok++; if (!soft) r.box = r.seen === 0 ? 2 : Math.min(4, r.box + 1); }
  else { r.box = 1; if (trap) store.traps[trap] = (store.traps[trap] || 0) + 1; }
  r.seen++; r.last = Date.now(); r.due = r.last + WAIT[r.box];
  store.r[id] = r; save();
}

// id: t4=用語④ / e3=矢印3番 / w1,f1,j1,m1,c1=台本の問題
const KINDS = {
  term: { t: "用語を思い出す", d: "説明から用語を選ぶ。覚えてきたら書いて答えます", n: 10 },

  judge: { t: "因果？相関？", d: "「同じ時期なだけ」を見やぶります", n: 8 },
  map: { t: "地図で場所を", d: "どこで起きて、どこへ広がったか", n: 8 },
  chain: { t: "鎖をつなぐ", d: "原因から結果の順に並べ、矢印の理由を選びます", n: 3 }
};
const kindOf = (id) => id[0] === "t" ? "term" : id[0] === "e" ? "edge" : ({ why: "why", whatif: "why", judge: "judge", map: "map", chain: "chain" })[qById[id].mode];
const ALL = [...termIds.map(t => "t" + t), ...EDGES.map((e, i) => "e" + i), ...QUESTIONS.map(q => q.id)];
const byKind = (k) => ALL.filter(id => kindOf(id) === k);
function nodesOf(id) {
  if (id[0] === "t") return [termNode[+id.slice(1)]];
  if (id[0] === "e") { const e = EDGES[+id.slice(1)]; return [e.from, e.to]; }
  return qById[id].nodes;
}
function prio(id) { // 小さいほど先に出す：時期が来た復習 → まだ → 先の予定
  const r = rec(id), now = Date.now();
  if (!r) return 1 + Math.random() * .6;
  if (r.due <= now) return r.box * .15 + Math.random() * .1;
  return 2 + (r.due - now) / DAY * .1;
}
const pickBy = (ids, n) => ids.map(id => [prio(id), id]).sort((a, b) => a[0] - b[0]).slice(0, n).map(x => x[1]);
const dueCount = () => ALL.filter(id => { const r = rec(id); return r && r.due <= Date.now(); }).length;
const unseenCount = () => ALL.filter(id => !rec(id)).length;
function buildDaily() {
  const quota = { term: 5, edge: 2, why: 2, judge: 1, map: 1, chain: 1 };
  let ids = [];
  for (const [k, n] of Object.entries(quota)) ids.push(...pickBy(byKind(k), n));
  const chain = ids.filter(id => kindOf(id) === "chain");
  ids = shuffle(ids.filter(id => kindOf(id) !== "chain"));
  ids.splice(Math.min(6, ids.length), 0, ...chain); // 長い「鎖」は真ん中あたりに
  return ids;
}
const masteryOfIds = (ids) => {
  const rs = ids.map(rec);
  if (!rs.some(Boolean)) return "none";
  const good = rs.filter(r => r && r.box >= 2).length;
  return good / ids.length >= .8 ? "done" : "mid";
};

      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + .25);
    }
  } catch (e) {}
}

function assocMap(a, masked) {

  }
  for (const id of ids) {
    const p = P(id);
    s2.append(sv("g", { class: "rs " + (st[id] ? "ok" : "ng"), style: `animation-delay:${delay[id]}ms` },
      sv("circle", { cx: p.x, cy: p.y, r: 13 }),
      sv("text", { x: p.x + 22, y: p.y + 9 }, nodeById[id].label[0].replace(/[・が]$/, ""))));
  }
  const trapCount = {}; for (const r of s.res) if (r.trap) trapCount[r.trap] = (trapCount[r.trap] || 0) + 1;
  const scoreN = el("span", { class: "num", text: reduced() ? String(ok) : "0" });
  const line = ok === n ? "全部の鎖がつながりました。" : ok / n >= .7 ? "あと少し。まちがえた矢印だけ、もう一度たどりましょう。" : "まちがえた所は、明日もう一度出ます。今日はもう一回だけ。";
  const learned = termIds.filter(t => termLevel(t) === "done").length;
  const main = wrong.length
    ? el("button", { class: "btn main", type: "button", onclick: () => startSession(shuffle(wrong), "まちがえた問題"), html: `<span>まちがえた${wrong.length}問をもう一度</span>` + I.go })
    : el("button", { class: "btn main", type: "button", onclick: () => startSession(buildDaily(), "今日の12問"), html: "<span>つづけて12問</span>" + I.go });
  const v = el("main", { class: "result", id: "main" }, el("div", { class: "wrap" },
    el("section", { class: "receipt", "aria-labelledby": "res-h" }, crops(),
      el("h2", { id: "res-h", tabindex: "-1", text: s.title + "　の結果" }),
      el("div", { class: "score" }, scoreN, el("span", { class: "of", text: `/ ${n} 問正解` })),
      el("p", { class: "res-line", text: line }),
      ok === n ? el("span", { class: "stamp on", "aria-hidden": "true", text: "全問正解" }) : null,
      el("div", { class: "res-sky" }, s2, el("span", { class: "cap", text: "今回たどった星" })),
      el("p", { class: "muted", style: "font-size:var(--t-min)", text: `書いて思い出せた用語：${learned} / 23語` }),
      Object.keys(trapCount).length ? el("div", {}, el("p", { style: "font-weight:700;margin-top:var(--f3)", text: "引っかかった理屈のわな" }), el("div", { class: "traps" }, Object.entries(trapCount).map(([k, c]) => el("span", { class: "chip", text: `${TRAPS[k] || k}　${c}` })))) : null,
      el("ul", { class: "res-list", "aria-label": "問題ごとの結果" }, s.res.map(r => el("li", {},
        el("span", { class: "mk " + (r.ok ? "ok" : "ng"), html: r.ok ? I.ok : I.ng }),
        el("span", {}, el("span", { class: "sr", text: r.ok ? "正解：" : "まちがい：" }), itemTitle(r.id)),
        el("span", { class: "kd", text: KIND_SHORT[kindOf(r.id)] })))),
      el("div", { class: "res-actions" }, main, el("button", { class: "btn", type: "button", text: "星座にもどる", onclick: () => renderHome() })))));
  show(v);
  document.title = `結果 ${ok}/${n} | 大航海の因果マップ`;
  requestAnimationFrame(() => $("#res-h").focus({ preventScroll: true }));
  announce(`${n}問中${ok}問正解。${line}`);
  // [motion:count] CELEBRATION trigger:結果を開く / total:1200ms / peak:終わり / easing:ease-out(3乗) / cleanup:最後に正しい数字で止まる
  if (!reduced() && ok > 0) { const t0 = performance.now(); const tick = (t) => { const p = Math.min(1, (t - t0) / 1200); scoreN.textContent = String(Math.round(ok * (1 - (1 - p) ** 3))); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
}

renderHome();
}
</script>
</body>
</html>
